name: Deploy Cypher to GitHub Pages

# Rebuilds deploy/_pymods/ fresh on every push, then uploads deploy/ as the
# Pages artifact -- no build step of its own beyond that. GitHub Pages'
# branch-based deploy only supports the repo root or a folder literally
# named /docs (neither fits: deploy/ is a self-contained static site, docs/
# is already used for internal project notes), so this workflow serves that
# role instead.
#
# deploy/_pymods/ is NOT committed (see .gitignore) -- it's pure build
# output of `python3 deploy/build.py` against shared/, sheet_types/, and
# levels/L1_text/, generated here on every run so it can never silently go
# stale relative to those sources. If this build step ever breaks, the
# workflow fails loudly instead of quietly deploying old Python logic.
#
# The __CACHE_BUST__ placeholders in deploy/index.html and deploy/assets/app.js
# get the commit SHA stamped in below. Python-mounted files use a per-page-load
# timestamp instead (see app.js's own _cacheBust) because that cost is a one-time
# Pyodide-boot expense; these are plain browser-cached JS assets, where busting
# on every load would defeat caching for no reason -- busting only when the
# deployed commit actually changes is the right level of aggression here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build deploy/_pymods/ (stdlib only -- no dependencies to install)
        run: python3 deploy/build.py
      - name: Stamp the commit SHA into cache-busting placeholders
        run: |
          sed -i "s/__CACHE_BUST__/${GITHUB_SHA}/g" deploy/index.html deploy/assets/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload deploy/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
